x-runtime: &runtime
  image: ai-kun-discord:local
  build: .
  env_file: .env
  environment:
    DATA_DIR: /app/data
    ASR_MODEL_PATH: /app/data/asr-model
    HTTP_HOST: 0.0.0.0
    # 同梱の埋め込みサーバーに合わせる（旧.envのgemma2/3072を上書き）。
    EMBEDDING_BASE_URL: http://127.0.0.1:11434/v1
    EMBEDDING_MODEL: embeddinggemma-2
    EMBEDDING_DIMENSION: "768"
  volumes:
    - bot-data:/app/data
  init: true
  stop_grace_period: 30s

services:
  bot:
    <<: *runtime
    network_mode: "service:embedding"
    depends_on:
      embedding:
        condition: service_healthy
    restart: unless-stopped

  # CPU専用。モデルはビルド時に取得し、実行時のダウンロードは不要。
  embedding:
    image: ai-kun-embedding:local
    build:
      context: .
      dockerfile: deploy/embedding/Dockerfile
      secrets:
        - hf_env
    # Web UIはbotと共有するネットワーク名前空間から公開する。
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    container_name: ai-kun-embedding
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # bot とネットワーク名前空間を共有し、ループバックだけで通信する。
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:11434/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16g
          pids: 512
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  bot-data:

secrets:
  hf_env:
    file: .env
