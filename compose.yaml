x-runtime: &runtime
  image: ai-kun-discord:local
  build: .
  env_file: .env
  environment:
    DATA_DIR: /app/data
    ASR_MODEL_PATH: /app/data/asr-model
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - bot-data:/app/data
  init: true
  stop_grace_period: 30s

services:
  bot:
    <<: *runtime
    restart: unless-stopped

volumes:
  bot-data:
